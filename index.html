<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanpi | Official Website</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.03);
            padding: 48px 36px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            max-width: 460px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }
        .logo-icon {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -2px;
            color: #f3f0e6;
            margin-bottom: 8px;
            line-height: 1;
        }
        .logo-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f3f0e6;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
        }
        .badge {
            display: inline-block;
            padding: 6px 16px;
            background-color: rgba(243, 240, 230, 0.08);
            color: #d1cdb8;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            border: 1px solid rgba(243, 240, 230, 0.15);
        }
        .description {
            color: #a1a1a6;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .contact-box {
            background-color: rgba(0, 0, 0, 0.25);
            padding: 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: border-color 0.2s ease;
        }
        .contact-box:hover {
            border-color: rgba(243, 240, 230, 0.2);
        }
        .contact-title {
            font-size: 0.75rem;
            color: #6e6e73;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .contact-email {
            color: #f3f0e6;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
        }
        .contact-email:hover {
            text-decoration: underline;
        }
        footer {
            margin-top: 28px;
            font-size: 0.78rem;
            color: #515154;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Текстовый аналог монограммы Fp, также можно заменить на <img src="лого.png"> -->
        <div class="logo-icon">Fp</div>
        <div class="logo-text">Fanpi</div>
        <div class="badge">Mobile App Development</div>
        
        <p class="description">
            We build modern mobile applications and digital services focused on quality, usability, and value for our users.
        </p>
        
        <div class="contact-box">
            <div class="contact-title">Support & Contact</div>
            <a href="mailto:nyutoni@gmail.com" class="contact-email">nyutoni@gmail.com</a>
        </div>

        <footer>
            © 2026 Fanpi. All rights reserved.
        </footer>
    </div>
</body>
</html>
